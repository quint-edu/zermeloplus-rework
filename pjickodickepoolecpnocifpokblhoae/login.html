<!DOCTYPE html>
<html lang="nl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <main class="page">
            <header class="topbar">
                <div class="brand"><img src="logo.png" alt=""><div><p class="eyebrow">Zermelo++</p><span class="muted">Je rooster, direct bij de hand</span></div></div>
                <select class="theme-select" id="theme-select" aria-label="Thema"><option value="system">Auto</option><option value="light">Licht</option><option value="dark">Donker</option></select>
            </header>
            <form class="panel" id="login-form">
                <h1>Welkom terug</h1>
                <p class="intro">Log in om je rooster te bekijken.</p>
                <p id="error-msg" hidden>Inloggen mislukt, probeer het opnieuw.</p>
                <label class="field-label" for="school-name">Schoolnaam</label>
                <input class="field" id="school-name" type="text" autocomplete="organization" placeholder="jouwschool">
                <label class="field-label" for="login-code">Login code</label>
                <input class="field" id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="12 cijfers">
                <a id="auto-fill-btn" hidden href="#">Klik hier om automatisch in te vullen</a>
                <button id="login-btn" type="submit">Inloggen</button>
            </form>
        </main>

        <script src="login.js"></script>
    </body>
</html>
